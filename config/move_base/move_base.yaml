# http://wiki.ros.org/move_base#Parameters

# General parameters
controller_frequency: 5.0 #10.0
planner_patience: 5.0
controller_patience: 3.0 # 15.0
shutdown_costmaps: false
oscillation_timeout: 10.0 #0.0
oscillation_distance: 0.2 #0.5
planner_frequency: 1.0 #0.0
max_planning_retries: 100

# Planner plugins
base_global_planner: global_planner/GlobalPlanner
# base_local_planner: base_local_planner/TrajectoryPlannerROS
base_local_planner: dwa_local_planner/DWAPlannerROS


# Recovery behavior parameters
recovery_behavior_enabled: true
clearing_rotation_allowed: true
conservative_reset_dist: 3.0
aggressive_reset_dist: 5
recovery_patience: 100